<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-labelledby="title"><title id="title">SupplySense AI: Forecasts material demand with five from-scratch time-series models, then turns each forecast into reorder points and purchase orders. 30 automated tests · CI on every push. Built with React 19, Node.js, Express 5, MongoDB.</title><style>@font-face{font-family:GM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GM;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@keyframes br{0%,100%{opacity:.65}50%{opacity:1}}.br{animation:br 7s ease-in-out infinite}@keyframes nu{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(2px,-2px)}}.nu{animation:nu 3.2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="cc"><rect width="420" height="240" rx="16"/></clipPath><radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="30" cy="0" r="300"><stop offset="0" stop-color="#34D399" stop-opacity="0.2"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient><linearGradient id="sw1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="0"><stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset="0.5" stop-color="#34D399" stop-opacity="1"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-180 0;-180 0;600 0" keyTimes="0;0.55;1" dur="6s" begin="0.75s" repeatCount="indefinite"/></linearGradient></defs><g clip-path="url(#cc)"><rect width="420" height="240" fill="#0A0F24"/><rect class="br" width="420" height="240" fill="url(#glow)"/><rect width="420" height="2" fill="url(#sw1)"/></g><rect x="0.5" y="0.5" width="419" height="239" rx="15.5" fill="none" stroke="#1D2650"/><text x="24.0" y="37.0" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="500" font-size="11" fill="#34D399" letter-spacing="1.3">02 · FULL-STACK · FORECASTING</text><rect x="334.0" y="21" width="64.0" height="22" rx="11" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.35"/><circle cx="347.0" cy="32" r="3" fill="#34D399"/><circle cx="347.0" cy="32" r="3" fill="none" stroke="#34D399" stroke-width="1.5"><animate attributeName="r" values="3;9.600000000000001" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite"/></circle><text x="357.0" y="35.8" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="500" font-size="10.5" fill="#34D399" letter-spacing="1.2">LIVE</text><text x="23.0" y="78.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="25" fill="#EEF1FF" letter-spacing="-0.5">SupplySense AI</text><text x="24.0" y="104.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#9AA4CB">Forecasts material demand with five from-scratch</text><text x="24.0" y="123.5" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#9AA4CB">time-series models, then turns each forecast into reorder</text><text x="24.0" y="143.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#9AA4CB">points and purchase orders.</text><text x="24.0" y="170.5" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="500" font-size="11.5" fill="#34D399">→ 30 automated tests · CI on every push</text><rect x="24.0" y="194" width="68.4" height="23" rx="6" fill="#10173A" stroke="#1D2650"/><t