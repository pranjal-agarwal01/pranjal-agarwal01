<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-labelledby="title"><title id="title">AI Newsletter: Collects AI news from RSS, Hacker News and arXiv, ranks it against a reader profile and emails an LLM-written digest. Runs twice a day on GitHub Actions, no server. Built with Python, GitHub Actions, SQLite, OpenRouter.</title><style>@font-face{font-family:GM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GM;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@keyframes br{0%,100%{opacity:.65}50%{opacity:1}}.br{animation:br 7s ease-in-out infinite}@keyframes nu{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(2px,-2px)}}.nu{animation:nu 3.2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="cc"><rect width="420" height="240" rx="16"/></clipPath><radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="30" cy="0" r="300"><stop offset="0" stop-color="#F472B6" stop-opacity="0.2"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient><linearGradient id="sw1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="0"><stop offset="0" stop-color="#F472B6" stop-opacity="0"/><stop offset="0.5" stop-color="#F472B6" stop-opacity="1"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-180 0;-180 0;600 0" keyTimes="0;0.55;1" dur="6s" begin="3.75s" repeatCount="indefinite"/></linearGradient></defs><g clip-path="url(#cc)"><rect width="420" height="240" fill="#0A0F24"/><rect class="br" width="420" height="240" fill="url(#glow)"/><rect width="420" height="2" fill="url(#sw1)"/></g><rect x="0.5" y="0.5" width="419" height="239" rx="15.5" fill="none" stroke="#1D2650"/><text x="24.0" y="37.0" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="500" font-size="11" fill="#F472B6" letter-spacing="1.3">06 · AI AUTOMATION</text><text x="23.0" y="78.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="25" fill="#EEF1FF" letter-spacing="-0.5">AI Newsletter</text><text x="24.0" y="104.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#9AA4CB">Collects AI news from RSS, Hacker News and arXiv, ranks</text><text x="24.0" y="123.5" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#9AA4CB">it against a reader profile and emails an LLM-written</text><text x="24.0" y="143.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#9AA4CB">digest.</text><text x="24.0" y="170.5" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="500" font-size="11.5" fill="#F472B6">→ Runs twice a day on GitHub Actions, no server</text><rect x="24.0" y="194" width="55.8" height="23" rx="6" fill="#10173A" stroke="#1D2650"/><text x="51.9" y="209.5" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="400" font-size="10.5" fill="#9AA4CB" text-anchor="middle">Python</text><rect x="85.8" y="194" width="106.2" height="23" rx="6" fill="#10173A" stroke="#1D2650"/><text x="138.9" y="209.5" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="400" font-size="10.5" fill="#9AA4CB" text-anchor="middle">GitHub Actions</text><rect x="198.0" y="194" width="55.8" height="23" rx="6" fill="#10173A" stroke="#1D2650"/><text x="225.9" y="209.5" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="400