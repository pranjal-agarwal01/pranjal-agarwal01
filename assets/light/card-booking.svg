<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-labelledby="title"><title id="title">Event Booking API: A Spring Boot booking API built for the hardest case: two people grabbing the last seat in the same millisecond. Exactly one wins. 50 threads · 1 seat · 1 winner, tested on Postgres. Built with Java 21, Spring Boot, PostgreSQL, Docker.</title><style>@font-face{font-family:GM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GM;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:G;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@keyframes br{0%,100%{opacity:.65}50%{opacity:1}}.br{animation:br 7s ease-in-out infinite}@keyframes nu{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(2px,-2px)}}.nu{animation:nu 3.2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="cc"><rect width="420" height="240" rx="16"/></clipPath><radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="30" cy="0" r="300"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.12"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><linearGradient id="sw1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity="0"/><stop offset="0.5" stop-color="#7C3AED" stop-opacity="1"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-180 0;-180 0;600 0" keyTimes="0;0.55;1" dur="6s" begin="3.0s" repeatCount="indefinite"/></linearGradient></defs><g clip-path="url(#cc)"><rect width="420" height="240" fill="#FFFFFF"/><rect class="br" width="420" height="240" fill="url(#glow)"/><rect width="420" height="2" fill="url(#sw1)"/></g><rect x="0.5" y="0.5" width="419" height="239" rx="15.5" fill="none" stroke="#DDE3F4"/><text x="24.0" y="37.0" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="500" font-size="11" fill="#7C3AED" letter-spacing="1.3">05 · BACKEND · CONCURRENCY</text><rect x="334.0" y="21" width="64.0" height="22" rx="11" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.35"/><circle cx="347.0" cy="32" r="3" fill="#059669"/><circle cx="347.0" cy="32" r="3" fill="none" stroke="#059669" stroke-width="1.5"><animate attributeName="r" values="3;9.600000000000001" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite"/></circle><text x="357.0" y="35.8" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="500" font-size="10.5" fill="#059669" letter-spacing="1.2">LIVE</text><text x="23.0" y="78.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="25" fill="#0B1024" letter-spacing="-0.5">Event Booking API</text><text x="24.0" y="104.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#4B5577">A Spring Boot booking API built for the hardest case: two</text><text x="24.0" y="123.5" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#4B5577">people grabbing the last seat in the same millisecond.</text><text x="24.0" y="143.0" font-family="G, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#4B5577">Exactly one wins.</text><text x="24.0" y="170.5" font-family="GM, ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="500" font-size="11.5" fill="#7C3AED">→ 50 threads · 1 seat · 1 winner, tested on Postgres</text><rect x="24.0" y="194" width="62.1" height="23" rx="6" fill="#F4F6